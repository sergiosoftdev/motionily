[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
scene.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
fontdue.workspace = true
gltf.workspace = true
glam.workspace = true
lyon_tessellation = "1"
rustybuzz = "0.20.1"

[dev-dependencies]
# Same naga as wgpu: checks the stage shader still translates to WebGL2's GLSL ES 3.0.
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
# Stills and tests without a window: `cargo run -p engine --example still`.
pollster = "0.4"
# Benchmark scenes: `cargo run -p engine --release --example bench`.
serde_json.workspace = true
png = "0.17"
