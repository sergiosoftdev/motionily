name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the desktop crate
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm
      - name: Rust tests (engine, scene) and the wasm and desktop builds
        run: |
          cargo test --workspace --exclude engine-wasm --exclude motionily-desktop
          cargo check -p engine-wasm --target wasm32-unknown-unknown
          cargo check -p motionily-desktop
      - run: pnpm -r typecheck
      - name: API tests on MongoDB
        run: pnpm --filter @motionily/api test
      - name: API tests on SQLite
        run: pnpm --filter @motionily/api test:sqlite

  # The system decoders (VideoToolbox on macOS, Media Foundation on Windows) against ffmpeg's frames.
  native-video:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_VIDEO_REQUIRE_FFMPEG: "1"
      NATIVE_VIDEO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version
      - run: cargo test -p native-video -- --nocapture
