[package]
name = "motionily-desktop"
version = "0.1.0"
description = "Motionily desktop: the editor, its API and the native engine on your own machine"
edition.workspace = true
license.workspace = true

[lib]
name = "motionily_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
engine.workspace = true
scene.workspace = true
pollster = "0.4"
wgpu.workspace = true
raw-window-handle = "0.6"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder"] }
